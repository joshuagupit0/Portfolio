<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sliding Pages</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      transition: transform 0.6s ease;
    }

    .page1 {
      background: #3498db;
      transform: translateX(0%);
      z-index: 2;
    }

    .page2 {
      background: #2ecc71;
      transform: translateX(100%);
      z-index: 1;
    }

    .container.next .page1 {
      transform: translateX(-100%);
    }

    .container.next .page2 {
      transform: translateX(0%);
    }

    .buttons {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
    }

    button {
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container" id="slider">
    <div class="page page1">
      <h1 style="color: white; text-align: center; padding-top: 40vh;">Page 1</h1>
      <button onclick="nextPage()">Next</button>
    </div>
    <div class="page page2">
      <h1 style="color: white; text-align: center; padding-top: 40vh;">Page 2</h1>
      <button onclick="prevPage()">Prev</button>
    </div>
    <div class="buttons">
      <button onclick="prevPage()">Prev</button>
      <button onclick="nextPage()">Next</button>
    </div>
  </div>

  <script>
    const slider = document.getElementById('slider');
    let isNext = false;

    function nextPage() {
      isNext = true;
      slider.classList.add('next');
    }

    function prevPage() {
      isNext = false;
      slider.classList.remove('next');
    }
  </script>
</body>
</html>
