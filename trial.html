<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Slide Pages</title>
  <style>
    body {
  overflow: hidden;
}

.page {
  position: absolute;
  width: 100%;
  height: 100vh;
  top: 0;
  left: 0;
  background: #f0f0f0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: opacity ease-in-out 1.2s;
  transition: transform 1.2s;
}

.page1 {
  z-index: 2;
}
.page1:not(.active) {
  opacity: 0;
  transform: scale(0.5);
}

.page2 {
  transform: translateX(100%);
  z-index: 1;
}

.page2.slide-in {
  transform: translateX(0%);
  z-index: 3;
  transition: 0.9s;
}

.page2.slide-out {
  transform: translateX(100%);
  z-index: 1;
  transition: 0.9s;
}

button {
  margin-top: 20px;
  padding: 10px 20px;
  font-size: 16px;
}
  </style>
</head>
<body>
  <div class="page page1 active">
    <h1>First Page</h1>
    <button class="next">Next →</button>
  </div>

  <div class="page page2">
    <h1>Second Page</h1>
    <button class="prev">← Previous</button>
  </div>

  
  <script>
    const page1 = document.querySelector('.page1');
    const page2 = document.querySelector('.page2');
    const nextBtn = document.querySelector('.next');
    const prevBtn = document.querySelector('.prev');

    nextBtn.addEventListener('click', () => {
      page1.classList.remove('active');
      page2.classList.add('slide-in');
      page2.classList.remove('slide-out');
    });

    prevBtn.addEventListener('click', () => {
      page2.classList.remove('slide-in');
      page2.classList.add('slide-out');
      page1.classList.add('active');
       // match transition duration
    });
  </script>
</body>
</html>
